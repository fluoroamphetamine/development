# Cloudflare R2 market-data manifest.
#
# This file is the canonical repo-local index that generated backtests should read
# before choosing R2 object keys. It is seeded from the successful GitHub Actions
# R2 smoke-test output and can be refreshed with scripts/build_r2_manifest.py.

bucket: futures-data
endpoint_env: R2_ENDPOINT
bucket_env: R2_BUCKET
access_key_env: R2_ACCESS_KEY_ID
secret_key_env: R2_SECRET_ACCESS_KEY

known_datasets:
  ES_1m:
    instrument: ES
    timeframe: 1m
    type: ohlcv
    format: parquet
    r2_key: ES/ES-20100606-20260315.ohlcv-1m.parquet
    status: confirmed_from_r2_smoke_test

  NIY_1m:
    instrument: NIY
    timeframe: 1m
    type: ohlcv
    format: parquet
    r2_key: NIY/niy-20100606-20251127.ohlcv-1m.parquet
    status: confirmed_from_r2_smoke_test

  NQ_1m:
    instrument: NQ
    timeframe: 1m
    type: ohlcv
    format: parquet
    r2_prefix: NQ/
    status: prefix_confirmed_exact_key_not_yet_listed

notes:
  - Generated backtests must not hard-code R2 credentials.
  - Generated backtests should use backtests.lib.r2_data for runtime loading.
  - For exact object reads, prefer r2_key over r2_prefix.
  - If only r2_prefix is known, the development agent should either list candidate keys or fail clearly if more than one parquet file matches.
