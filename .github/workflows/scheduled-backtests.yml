name: scheduled-backtests

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-backtests
  cancel-in-progress: false

jobs:
  run-next-backtest:
    runs-on: ubuntu-latest

    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install base dependencies
        run: |
          python -m pip install --upgrade pip
          pip install polars pyarrow boto3 botocore pyyaml pandas numpy

      - name: Ensure required folders exist
        run: |
          mkdir -p strategies/pending
          mkdir -p backtests/generated
          mkdir -p backtests/results
          mkdir -p scripts
          mkdir -p data

      - name: Verify R2 access
        run: |
          python scripts/check_r2_access.py

      - name: Refresh R2 manifest
        run: |
          python scripts/build_r2_manifest.py --output data/r2_manifest.yaml

      - name: Find next untested strategy
        id: next_strategy
        run: |
          python scripts/find_next_backtest.py \
            --strategies-dir strategies/pending \
            --ledger backtests/BACKTEST_LEDGER.md \
            --output next_strategy.env

          cat next_strategy.env >> "$GITHUB_OUTPUT"

      - name: Stop if no pending strategies
        if: steps.next_strategy.outputs.has_strategy != 'true'
        run: |
          echo "No pending strategies to backtest."

      - name: Run strategy backtest
        if: steps.next_strategy.outputs.has_strategy == 'true'
        id: run_backtest
        continue-on-error: true
        run: |
          python scripts/run_strategy_backtest.py \
            --strategy-id "${{ steps.next_strategy.outputs.strategy_id }}" \
            --contract-path "${{ steps.next_strategy.outputs.contract_path }}" \
            --output-dir "backtests/results/${{ steps.next_strategy.outputs.strategy_id }}"

      - name: Print strategy backtest log
        if: always() && steps.next_strategy.outputs.has_strategy == 'true'
        run: |
          LOG_PATH="backtests/results/${{ steps.next_strategy.outputs.strategy_id }}/run.log"
          echo "----- ${LOG_PATH} -----"
          if [ -f "$LOG_PATH" ]; then
            cat "$LOG_PATH"
          else
            echo "No run.log was written."
          fi

      - name: Set final backtest status
        if: steps.next_strategy.outputs.has_strategy == 'true'
        id: final_status
        run: |
          if [ "${{ steps.run_backtest.outcome }}" = "success" ]; then
            echo "status=completed" >> "$GITHUB_OUTPUT"
          else
            if [ -f "backtests/results/${{ steps.next_strategy.outputs.strategy_id }}/missing_backtest_package.flag" ]; then
              echo "status=missing_backtest_package" >> "$GITHUB_OUTPUT"
            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Update backtest ledger
        if: always() && steps.next_strategy.outputs.has_strategy == 'true'
        run: |
          python scripts/update_backtest_ledger.py \
            --ledger backtests/BACKTEST_LEDGER.md \
            --strategy-id "${{ steps.next_strategy.outputs.strategy_id }}" \
            --contract-path "${{ steps.next_strategy.outputs.contract_path }}" \
            --result-dir "backtests/results/${{ steps.next_strategy.outputs.strategy_id }}" \
            --status "${{ steps.final_status.outputs.status }}" \
            --workflow-run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Commit updates
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git config pull.rebase true
          git config rebase.autoStash true

          git stash push --include-untracked -m workflow-updates || true
          git pull --rebase origin main
          git stash pop || true

          git add data/r2_manifest.yaml backtests/BACKTEST_LEDGER.md backtests/results/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Refresh R2 manifest and backtest outputs"

          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt ${attempt} failed; retrying after rebase."
            sleep 2
          done

          echo "Failed to push workflow updates after retries."
          exit 1
